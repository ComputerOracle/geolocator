[package]
name = "geolocator"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.15.0"
btleplug = "0.13.0"
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
