<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geolocator // Proximity & Radar Intelligence Suite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  </head>
  <body>
    <!-- Top Header HUD -->
    <header class="hud-header">
      <div class="brand-wrapper">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
          <path d="M2 12h20"></path>
          <circle cx="12" cy="12" r="3" fill="currentColor"></circle>
        </svg>
        <div>
          <h1 class="brand-title">GEOLOCATOR</h1>
          <span class="brand-tag">v0.1.0 • BLE + GPS INTEL</span>
        </div>
      </div>

      <div class="hud-stats">
        <div class="stat-chip">
          <span class="stat-label">Active BLE Targets</span>
          <span class="stat-value" id="hud-active-devices">0</span>
        </div>
        <div class="stat-chip">
          <span class="stat-label">Total Queries</span>
          <span class="stat-value" id="hud-total-queries">0</span>
        </div>
        <div class="status-badge" id="hud-server-status">
          <span class="status-dot"></span>
          <span id="hud-status-text">CONNECTING</span>
        </div>
      </div>
    </header>

    <!-- Navigation Menu Tabs -->
    <nav class="tab-nav">
      <button class="nav-tab active" data-tab="tab-map">
        <span>📍</span> Interactive Map
      </button>
      <button class="nav-tab" data-tab="tab-radar">
        <span>📡</span> Sonar Radar
      </button>
      <button class="nav-tab" data-tab="tab-planner">
        <span>📏</span> Route & Steps
      </button>
      <button class="nav-tab" data-tab="tab-geofence">
        <span>🛡️</span> Geofence Alert
      </button>
      <button class="nav-tab" data-tab="tab-telemetry">
        <span>📊</span> Telemetry & Health
      </button>
    </nav>

    <!-- Main Viewport -->
    <main class="main-viewport">
      <section id="tab-map" class="view-section active"></section>
      <section id="tab-radar" class="view-section"></section>
      <section id="tab-planner" class="view-section"></section>
      <section id="tab-geofence" class="view-section"></section>
      <section id="tab-telemetry" class="view-section"></section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
